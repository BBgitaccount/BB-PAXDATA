repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, sqlalchemy, pandera, pandas, pandas-stubs, types-requests, types-redis, types-aiofiles]
        args: ["--config-file=pyproject.toml", "src"]
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: src/bb_paxdata/interfaces/web/src/.*\.(ts|tsx|css|json)$
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm run --prefix src/bb_paxdata/interfaces/web lint
        language: node
        files: src/bb_paxdata/interfaces/web/src/.*\.(ts|tsx)$
        pass_filenames: false