repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            pydantic,
            sqlalchemy,
            pandera,
            pandas,
            pandas-stubs,
            types-requests,
            types-redis,
            types-aiofiles,
          ]
        args: ["--config-file=pyproject.toml", "src"]
        pass_filenames: false
  # Prettier disabled due to Windows crash - using npm run format instead
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v4.0.0-alpha.8
  #   hooks:
  #     - id: prettier
  #       files: src/bb_paxdata/interfaces/web/src/.*\.(ts|tsx|css|json)$
  #       args: [--config=src/bb_paxdata/interfaces/web/.prettierrc]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(scripts/|tests/)
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: poetry run deptry src
        language: system
        pass_filenames: false
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm run --prefix src/bb_paxdata/interfaces/web lint -- --fix
        language: node
        files: src/bb_paxdata/interfaces/web/src/.*\.(ts|tsx)$
        pass_filenames: false
