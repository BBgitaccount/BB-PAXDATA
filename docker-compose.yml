services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: paxdata-prometheus
    volumes:
      - ./src/bb_paxdata/infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - paxdata-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: paxdata-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/system_overview.json
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/bb_paxdata/infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/bb_paxdata/infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - paxdata-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: paxdata-postgres
    environment:
      - POSTGRES_USER=paxdata_user
      - POSTGRES_PASSWORD=paxdata_password
      - POSTGRES_DB=paxdata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxdata_user -d paxdata_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - paxdata-net

  redis:
    image: redis:7-alpine
    container_name: paxdata-redis
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - paxdata-net

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: paxdata-meilisearch
    environment:
      - MEILI_MASTER_KEY=paxdata-meilisearch-key
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - paxdata-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: paxdata-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=paxdata_access_key
      - MINIO_ROOT_PASSWORD=paxdata_secret_key
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - paxdata-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paxdata-api
    command: sh -c "poetry run alembic upgrade 20260618_apvt && poetry run alembic upgrade 1236a0b96382 && uvicorn bb_paxdata.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PAXDATA_DATABASE_MODE=postgresql
      - PAXDATA_DATABASE_URL=postgresql+asyncpg://paxdata_user:paxdata_password@postgres:5432/paxdata_db
      - PAXDATA_DATABASE_REPLICA_URL=postgresql+asyncpg://paxdata_user:paxdata_password@postgres:5432/paxdata_db
      - PAXDATA_REDIS_URL=redis://redis:6379/0
      - PAXDATA_ENVIRONMENT=development
      - PAXDATA_DEBUG=true
      - PAXDATA_OTEL_ENABLED=true
      - PAXDATA_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - PAXDATA_CORS_ALLOWED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174","http://localhost:5175","http://127.0.0.1:5175","http://localhost:5176","http://127.0.0.1:5176"]

    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks:
      - paxdata-net

  web:
    build:
      context: ./src/bb_paxdata/interfaces/web
      dockerfile: Dockerfile
    container_name: paxdata-web
    environment:
      - VITE_API_URL=http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src/bb_paxdata/interfaces/web/src:/app/src
      - ./src/bb_paxdata/interfaces/web/public:/app/public
      - ./src/bb_paxdata/interfaces/web/index.html:/app/index.html
      - ./src/bb_paxdata/interfaces/web/package.json:/app/package.json
      - ./src/bb_paxdata/interfaces/web/tsconfig.json:/app/tsconfig.json
      - ./src/bb_paxdata/interfaces/web/vite.config.ts:/app/vite.config.ts
      - ./src/bb_paxdata/interfaces/web/tailwind.config.js:/app/tailwind.config.js
      - ./src/bb_paxdata/interfaces/web/postcss.config.js:/app/postcss.config.js
      - web_node_modules:/app/node_modules
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  celery-worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paxdata-celery-worker-cpu
    command: celery -A bb_paxdata.infrastructure.tasks.celery_app worker -Q ai_cpu --loglevel=info --concurrency=2
    environment:
      - PAXDATA_DATABASE_MODE=postgresql
      - PAXDATA_DATABASE_URL=postgresql+asyncpg://paxdata_user:paxdata_password@postgres:5432/paxdata_db
      - PAXDATA_REDIS_URL=redis://redis:6379/0
      - PAXDATA_OTEL_ENABLED=true
      - PAXDATA_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  celery-worker-io:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paxdata-celery-worker-io
    command: celery -A bb_paxdata.infrastructure.tasks.celery_app worker -Q graph_io --loglevel=info --concurrency=4
    environment:
      - PAXDATA_DATABASE_MODE=postgresql
      - PAXDATA_DATABASE_URL=postgresql+asyncpg://paxdata_user:paxdata_password@postgres:5432/paxdata_db
      - PAXDATA_REDIS_URL=redis://redis:6379/0
      - PAXDATA_MEILISEARCH_URL=http://meilisearch:7700
      - PAXDATA_OTEL_ENABLED=true
      - PAXDATA_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paxdata-celery-beat
    command: celery -A bb_paxdata.infrastructure.tasks.celery_app beat --loglevel=info
    environment:
      - PAXDATA_DATABASE_MODE=postgresql
      - PAXDATA_DATABASE_URL=postgresql+asyncpg://paxdata_user:paxdata_password@postgres:5432/paxdata_db
      - PAXDATA_REDIS_URL=redis://redis:6379/0
      - PAXDATA_OTEL_ENABLED=true
      - PAXDATA_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  flower:
    image: mher/flower:2.0
    container_name: paxdata-flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  # Exporters for Prometheus scraping (Görev 2)
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: paxdata-celery-exporter
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
      - CE_LISTEN_ADDRESS=0.0.0.0:8888
    ports:
      - "8888:8888"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - paxdata-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: paxdata-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: paxdata-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://paxdata_user:paxdata_password@postgres:5432/paxdata_db?sslmode=disable
    volumes:
      - ./src/bb_paxdata/infrastructure/observability/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    ports:
      - "9187:9187"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paxdata-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: paxdata-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - paxdata-net

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: paxdata-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - paxdata-net

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  meilisearch_data:
  minio_data:
  web_node_modules:

networks:
  paxdata-net:
    driver: bridge
