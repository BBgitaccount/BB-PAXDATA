[tool.poetry]
name = "bb-paxdata"
version = "1.0.2"
description = "Diplomatik Söylem Analiz Motoru"
authors = ["BB-PAXDATA Team"]
packages = [
    {include = "bb_paxdata", from = "src"}
]

[tool.poetry.scripts]
paxdata = "bb_paxdata.interfaces.cli.main:entrypoint"

[tool.poetry.dependencies]
python          = ">=3.12,<3.15"
pydantic        = "^2.7"
pydantic-settings = "^2.3"
email-validator = "^2.0"
sqlalchemy      = {version = "^2.0", extras = ["asyncio"]}
aiosqlite       = "^0.20"
alembic         = "^1.13"
typer           = "^0.25.1"
rich            = "^13.7"
structlog       = "24.2"
pandas          = "^2.2"
pandera         = ">=0.20.0"
spacy           = ">=3.8.0,<3.9.0"
# spaCy models are installed as local .whl files inside Docker (see Dockerfile.api)
# The .whl files are pre-downloaded to docker/models/ to avoid unreliable network calls during build.
# en-core-web-sm  -> docker/models/en_core_web_sm-3.8.0-py3-none-any.whl
# tr-core-news-md -> docker/models/tr_core_news_md-1.0-py3-none-any.whl
vaderSentiment  = "^3.3"
langdetect      = "^1.0"
networkx        = "^3.0"
numpy           = "<2.0.0"
scipy           = "^1.13"
scikit-learn    = "^1.5"
bertopic        = "^0.16.0"
sentence-transformers = "^3.0"
umap-learn      = "^0.5.6"
hdbscan         = "^0.8.33"
ftfy = "^6.3.1"
deepeval = "^4.0.2"
textual = "0.86.0"
plotly = "^6.7.0"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"
pgvector = "^0.3.6"
watchdog = "^6.0.0"
fastapi = "^0.136.3"
sentry-sdk = "^2.60.0"
strawberry-graphql = {version = ">=0.235.0", extras = ["fastapi"]}
aiodataloader = "^0.4.0"
uvicorn = "^0.48.0"
prometheus-client = "^0.25.0"
slowapi = "^0.1.9"
pyjwt = "^2.13.0"
redis = "^5.0.2"
meilisearch-python-sdk = "^4.0"
celery = {version = "^5.4", extras = ["redis"]}
flower = "^2.0"
circuitbreaker = "^2.0"
boto3 = "^1.38"
cryptography = "^48.0"
pyarrow = "^23.0.1"
aiohttp = "^3.14.1"
transformers = ">=4.48.0,<5.0.0"
ragatouille = { version = ">=0.0.8,<0.1.0" }
# --- ACTIVE CPU-ONLY PYTORCH CONFIGURATION ---
torch = { version = "^2.3.0", source = "pytorch-cpu" }
# --- FUTURE GPU/CUDA PYTORCH CONFIGURATION (Commented out) ---
# To enable GPU/CUDA support:
# 1. Comment out the CPU line above.
# 2. Uncomment the line below.
# torch = "^2.3.0"
torch-geometric = { version = "^2.6.0", optional = true }
torch-scatter = { version = "^2.1.2", optional = true }
torch-sparse = { version = "^0.6.18", optional = true }
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation = "^0.45b0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-instrumentation-sqlalchemy = "^0.45b0"
opentelemetry-exporter-otlp = "^1.24.0"
apscheduler = "^3.11.2"
mlflow = "^3.14.0"
reportlab = "^4.2.0"
openpyxl = "^3.1.0"
keybert = "^0.9.0"


[tool.poetry.extras]
graph = ["torch-geometric", "torch-scatter", "torch-sparse"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# --- FUTURE GPU/CUDA PYTORCH SOURCES (Commented out) ---
# To enable GPU/CUDA support, uncomment these source blocks:
# [[tool.poetry.source]]
# name = "pytorch-cu118"
# url = "https://download.pytorch.org/whl/cu118"
# priority = "explicit"
#
# [[tool.poetry.source]]
# name = "pyg-cu118"
# url = "https://data.pyg.org/whl/torch-2.3.0+cu118.html"
# priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest          = ">=9.0.3"
pytest-asyncio  = ">=0.25.0"
mypy            = "^1.10"
ruff            = "^0.4"
pre-commit      = "^4.0"
black           = ">=26.3.1"
pandas-stubs    = "^2.2"
jsonschema = "^4.26.0"
httpx = "^0.28.1"
bandit = "^1.9.4"
deptry = "^0.25.1"
pytest-cov = "^7.1.0"
pip-audit = "^2.10.1"



[tool.mypy]
python_version = "3.12"
ignore_errors = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "pandera.mypy"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC", "PLE", "PLR", "PLW", "RUF"]
ignore = [
    "PLR2004", "PLR0913", "PLR0912", "PLR0915", "PLR0911",
    "RUF001", "RUF002", "RUF003", "RUF012",
    "E501", "PLW0603", "PLW2901", "PLC0415"
]

[tool.ruff.lint.isort]
known-first-party = ["bb_paxdata"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/bb_paxdata/interfaces/cli/main.py" = ["PLC0415", "E402"]
"src/bb_paxdata/application/commands/build.py" = ["E402"]
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers = [
    "ai: Tests that require AI API calls",
    "logic: Tests that do not require AI (logic, NLP rules, unit tests)",
    "e2e: End-to-end pipeline tests"
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules", "frontend", "dashboards", "scripts"]
skips = ["B615", "B608", "B604", "B318"]

[tool.deptry]
extend_exclude = ["tests", ".venv", "frontend", "dashboards", "scripts", "alembic", "docs"]
known_first_party = ["bb_paxdata"]

[tool.deptry.per_rule_ignores]
DEP001 = ["nbformat", "newrelic", "ddtrace", "tests"]
DEP002 = ["email-validator", "aiosqlite", "alembic", "textual", "plotly", "asyncpg", "psycopg2-binary", "flower", "aiohttp", "torch-scatter", "torch-sparse", "mlflow"]
DEP003 = ["botocore", "yaml", "tenacity", "aiofiles", "jinja2", "charset_normalizer"]
DEP004 = ["httpx", "pytest"]